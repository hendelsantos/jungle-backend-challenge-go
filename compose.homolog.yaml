# Homologation environment: real AWS SQS, everything else local Docker.
# Activated explicitly — it never overlays docker-compose.yml (LocalStack).
#
#   export JUNGLE_HOMOLOG_PROJECT=jungle-homolog-<user>
#   export JUNGLE_HOMOLOG_AWS_DIR=~/.aws/jungle-homolog   # credentials+config, outside the repo
#   export JUNGLE_HOMOLOG_REGION=sa-east-1
#   export JUNGLE_HOMOLOG_QUEUE_PREFIX=homolog-<user>-
#   export JUNGLE_HOMOLOG_PROVIDER_KEYS='{"provider-a":"<hmac-key>","provider-b":"<hmac-key>"}'
#   docker compose -f compose.homolog.yaml up --build -d
#
# The AWS directory must define the profiles jungle-homolog-provisioner,
# jungle-homolog-consumer and jungle-homolog-publisher. Prefer temporary
# credentials or roles. No credential is versioned; see docs/HOMOLOGACAO_AWS.md.
name: ${JUNGLE_HOMOLOG_PROJECT:?Set an explicit jungle-homolog-* project}
services:
  postgres:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:${JUNGLE_HOMOLOG_PG_PORT:-59542}:5432"
    environment:
      POSTGRES_USER: jungle
      POSTGRES_PASSWORD: jungle-homolog
      POSTGRES_DB: jungle
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U jungle -d jungle"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - jungle-homolog-postgres:/var/lib/postgresql/data
  migrate:
    image: ${JUNGLE_IMAGE:-jungle-backend-go:homolog}
    build:
      context: .
      args:
        GO_BUILD_TAGS: ${JUNGLE_BUILD_TAGS:-}
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://jungle:jungle-homolog@postgres:5432/jungle?sslmode=disable
    entrypoint: ["/usr/local/bin/migrate", "-path", "/usr/local/share/jungle/migrations", "up"]
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_HOSTNAME: "http://keycloak:8080"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:${JUNGLE_HOMOLOG_OIDC_PORT:-59090}:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 40s
    volumes:
      - ./deployments/keycloak:/opt/keycloak/data/import:ro
  provision-sqs:
    image: ${JUNGLE_IMAGE:-jungle-backend-go:homolog}
    build:
      context: .
      args:
        GO_BUILD_TAGS: ${JUNGLE_BUILD_TAGS:-}
    restart: "no"
    # No SQS_ENDPOINT_URL: the SDK resolves the managed AWS endpoint of the
    # configured region. The provisioner identity is its own profile.
    environment:
      SQS_REGION: ${JUNGLE_HOMOLOG_REGION:?Set the homologation region}
      SQS_QUEUE_PREFIX: ${JUNGLE_HOMOLOG_QUEUE_PREFIX:?Set a homologation queue prefix}
      AWS_SHARED_CREDENTIALS_FILE: /etc/jungle-aws/credentials
      AWS_CONFIG_FILE: /etc/jungle-aws/config
      SQS_PROVISIONER_PROFILE: jungle-homolog-provisioner
    volumes:
      - ${JUNGLE_HOMOLOG_AWS_DIR:?Set the external AWS credentials directory}:/etc/jungle-aws:ro
    entrypoint: ["/usr/local/bin/provision-sqs"]
  api:
    image: ${JUNGLE_IMAGE:-jungle-backend-go:homolog}
    build:
      context: .
      args:
        GO_BUILD_TAGS: ${JUNGLE_BUILD_TAGS:-}
    deploy:
      replicas: 3
    depends_on:
      migrate:
        condition: service_completed_successfully
      provision-sqs:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
    environment:
      HTTP_ADDR: ":8080"
      PG_POOL_MAX_CONNS: ${JUNGLE_HOMOLOG_PG_POOL_MAX_CONNS:-24}
      OUTBOX_WORKERS: ${JUNGLE_HOMOLOG_OUTBOX_WORKERS:-3}
      JUNGLE_TEST_POST_COMMIT_PAUSE: ${JUNGLE_TEST_POST_COMMIT_PAUSE:-}
      JUNGLE_TEST_PUBLISH_ACK_PAUSE: ${JUNGLE_TEST_PUBLISH_ACK_PAUSE:-}
      LOG_LEVEL: info
      DATABASE_URL: postgres://jungle:jungle-homolog@postgres:5432/jungle?sslmode=disable
      OIDC_ISSUER: http://keycloak:8080/realms/jungle
      OIDC_AUDIENCE: jungle-api
      # Managed AWS SQS: explicit gate, no endpoint override.
      SQS_ENABLED: "true"
      SQS_REGION: ${JUNGLE_HOMOLOG_REGION}
      SQS_QUEUE_PREFIX: ${JUNGLE_HOMOLOG_QUEUE_PREFIX}
      AWS_SHARED_CREDENTIALS_FILE: /etc/jungle-aws/credentials
      AWS_CONFIG_FILE: /etc/jungle-aws/config
      SQS_CONSUMER_PROFILE: jungle-homolog-consumer
      SQS_PUBLISHER_PROFILE: jungle-homolog-publisher
      # Provider HMAC keys supplied by the operator; never versioned.
      SQS_PROVIDER_KEYS: ${JUNGLE_HOMOLOG_PROVIDER_KEYS:?Set the provider HMAC keys JSON}
    volumes:
      - ${JUNGLE_HOMOLOG_AWS_DIR}:/etc/jungle-aws:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health/live >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 30
  gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./deployments/gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:${JUNGLE_HOMOLOG_GATEWAY_PORT:-9090}:80"
    depends_on:
      keycloak:
        condition: service_healthy
volumes:
  jungle-homolog-postgres:
