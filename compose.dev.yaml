# Development dependencies. The full delivery Compose will add the application and migrations.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: jungle
      POSTGRES_PASSWORD: jungle-local
      POSTGRES_DB: jungle
    ports:
      - "127.0.0.1:${JUNGLE_PG_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jungle -d jungle"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - jungle-postgres:/var/lib/postgresql/data
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_HOSTNAME: "http://localhost:${JUNGLE_OIDC_PORT:-58080}"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:${JUNGLE_OIDC_PORT:-58080}:8080"
    volumes:
      - ./deployments/keycloak:/opt/keycloak/data/import:ro
  localstack:
    image: localstack/localstack:4.14.0
    environment:
      SERVICES: sqs
      SQS_ENDPOINT_STRATEGY: dynamic
    ports:
      - "127.0.0.1:${JUNGLE_SQS_PORT:-4566}:4566"
    healthcheck:
      test: ["CMD-SHELL", "awslocal sqs list-queues >/dev/null"]
      interval: 2s
      timeout: 3s
      retries: 60
volumes:
  jungle-postgres:
