# Delivery environment, isolated from compose.dev.yaml by project name and
# overridable loopback ports: one `docker compose up --build` from a clean checkout
# provides PostgreSQL, Keycloak, LocalStack, migrations and three application
# replicas behind a single gateway. Credentials are fictional local values.
name: jungle-delivery
services:
  postgres:
    image: postgres:17-alpine
    # Loopback publication lets the independent verifier (cmd/verifywallet)
    # audit cents with read-only SQL; nothing else touches the database.
    ports:
      - "127.0.0.1:${JUNGLE_DELIVERY_PG_PORT:-59532}:5432"
    environment:
      POSTGRES_USER: jungle
      POSTGRES_PASSWORD: jungle-local
      POSTGRES_DB: jungle
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jungle -d jungle"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - jungle-postgres:/var/lib/postgresql/data
  migrate:
    image: jungle-backend-go:delivery
    build: .
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://jungle:jungle-local@postgres:5432/jungle?sslmode=disable
    entrypoint: ["/usr/local/bin/migrate", "-path", "/usr/local/share/jungle/migrations", "up"]
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    command: ["start-dev", "--import-realm"]
    # The issuer validated by the application is http://keycloak:8080 so the
    # service replicas resolve the IdP inside the network; the host obtains
    # tokens through the published loopback port.
    environment:
      KC_HOSTNAME: "http://keycloak:8080"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:${JUNGLE_DELIVERY_OIDC_PORT:-59080}:8080"
    healthcheck:
      # The management port answers on localhost:9000 inside the container.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 40s
    volumes:
      - ./deployments/keycloak:/opt/keycloak/data/import:ro
  localstack:
    image: localstack/localstack:4.14.0
    environment:
      SERVICES: sqs
      SQS_ENDPOINT_STRATEGY: dynamic
    # Loopback publication lets the fault script sign and publish wagers from
    # the host; the broker stays unreachable from outside the machine.
    ports:
      - "127.0.0.1:${JUNGLE_DELIVERY_SQS_PORT:-49570}:4566"
    healthcheck:
      test: ["CMD-SHELL", "awslocal sqs list-queues >/dev/null"]
      interval: 2s
      timeout: 3s
      retries: 60
  api:
    image: jungle-backend-go:delivery
    build: .
    # Three independent processes with their own connection pools gate the
    # concurrency criteria; the gateway round-robins across them.
    deploy:
      replicas: 3
    depends_on:
      migrate:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
      localstack:
        condition: service_healthy
    environment:
      HTTP_ADDR: ":8080"
      # Optional per-replica pool sizing for A/B experiments; empty keeps the
      # pgxpool per-process default.
      PG_POOL_MAX_CONNS: ${JUNGLE_DELIVERY_PG_POOL_MAX_CONNS:-24}
      OUTBOX_WORKERS: ${JUNGLE_DELIVERY_OUTBOX_WORKERS:-3}
      LOG_LEVEL: info
      DATABASE_URL: postgres://jungle:jungle-local@postgres:5432/jungle?sslmode=disable
      OIDC_ISSUER: http://keycloak:8080/realms/jungle
      OIDC_AUDIENCE: jungle-api
      SQS_ENDPOINT_URL: http://localstack:4566
      SQS_REGION: us-east-1
      # Explicit fictional credentials for this local broker only.
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      # Fictional local provider signing keys; never use outside development.
      SQS_PROVIDER_KEYS: '{"provider-a":"local-provider-a-signing-key-32-bytes-minimum","provider-b":"local-provider-b-signing-key-32-bytes-minimum"}'
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health/live >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 30
  gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./deployments/gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:${JUNGLE_DELIVERY_GATEWAY_PORT:-9080}:80"
    depends_on:
      keycloak:
        condition: service_healthy
      localstack:
        condition: service_healthy
volumes:
  jungle-postgres:
