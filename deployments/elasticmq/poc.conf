include classpath("application.conf")

# Queue URLs mirror the incoming request host, so host and container callers
# both receive usable URLs.
node-address {
  protocol = http
  host = "*"
  port = 9324
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

# Runtime event persistence to the H2 file database under /data (volume):
# every queue/message create, update or delete is recorded, and the full state
# is restored on startup. This is the mechanism under evaluation for A02.
messages-storage {
  enabled = true
}

aws {
  region = "us-east-1"
  accountId = "000000000000"
}
