# The gateway resolves the backing service per request through Docker's
# embedded DNS (round-robin over api replicas). Classic nginx upstream blocks
# pin one IP at startup; the variable plus a resolver keeps all replicas in
# the rotation. Loopback-only publication keeps this local as required.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    location / {
        set $upstream http://api:8080;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 15s;
        proxy_connect_timeout 5s;
    }
}
